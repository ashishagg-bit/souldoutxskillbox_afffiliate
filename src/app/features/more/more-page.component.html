<app-phone-shell activeTab="More">
  <div class="flex items-center gap-3 p-5">
    <div class="flex h-14 w-14 items-center justify-center rounded-full bg-gray-100">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.5">
        <circle cx="12" cy="8" r="3.2" />
        <path d="M5 20c0-3.3 3.1-6 7-6s7 2.7 7 6" stroke-linecap="round" />
      </svg>
    </div>
    <div>
      <p class="text-[17px] font-semibold text-ink">Avadh Nagpal</p>
      <p class="text-[14px] text-muted">avadh&#64;souldout.in</p>
    </div>
  </div>
  <div class="border-t border-line"></div>

  <div class="grid grid-cols-3 gap-y-6 px-5 py-6 text-center">
    @for (tile of plainTiles; track tile.label) {
      <div class="flex flex-col items-center gap-2">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="1.5">
          @switch (tile.icon) {
            @case ("user") {
              <circle cx="12" cy="8" r="3.2" />
              <path d="M5 20c0-3.3 3.1-6 7-6s7 2.7 7 6" stroke-linecap="round" />
            }
            @case ("ticket") {
              <path
                d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a1.6 1.6 0 0 0 0 3.2V16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2.8a1.6 1.6 0 0 0 0-3.2V8Z"
                stroke-linejoin="round"
              />
            }
            @case ("settings") {
              <circle cx="12" cy="12" r="3" />
              <path
                d="M12 3.5 12 6M12 18v2.5M20.5 12H18M6 12H3.5M17.7 6.3l-1.8 1.8M8.1 15.9l-1.8 1.8M17.7 17.7l-1.8-1.8M8.1 8.1 6.3 6.3"
                stroke-linecap="round"
              />
            }
            @case ("share") {
              <path d="M12 15V4M12 4 8.5 7.5M12 4l3.5 3.5" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" stroke-linecap="round" stroke-linejoin="round" />
            }
            @case ("scan") {
              <path
                d="M4 8V6a2 2 0 0 1 2-2h2M20 8V6a2 2 0 0 0-2-2h-2M4 16v2a2 2 0 0 0 2 2h2M20 16v2a2 2 0 0 1-2 2h-2"
                stroke-linecap="round"
              />
              <path d="M4 12h16" stroke-linecap="round" />
            }
            @case ("chart") {
              <path d="M5 20V10M12 20V4M19 20v-7" stroke-linecap="round" />
            }
          }
        </svg>
        <span class="text-[13px] text-ink">{{ tile.label }}</span>
      </div>
    }
  </div>

  <div class="grid grid-cols-3 gap-3 px-5 pb-6">
    <div class="flex flex-col items-center gap-2 rounded-2xl border border-line py-5 opacity-60">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="1.6">
        <circle cx="12" cy="12" r="8.5" />
        <path d="M14.5 9.3c-.4-.7-1.3-1.1-2.3-1.1-1.4 0-2.6.8-2.6 1.9 0 2.8 5 1.4 5 4.1 0 1.2-1.3 1.9-2.7 1.9-1.1 0-2-.4-2.5-1.2M12 6.8v1.4M12 15.8v1.4" stroke-linecap="round" />
      </svg>
      <span class="text-[13px] font-medium text-ink">Earn</span>
    </div>
    <a routerLink="/gigs" class="flex flex-col items-center gap-2 rounded-2xl border border-line py-5">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="1.6">
        <circle cx="8.5" cy="8" r="3" />
        <path d="M2.5 19c0-3 2.7-5.4 6-5.4s6 2.4 6 5.4" stroke-linecap="round" />
        <path d="M15.5 8.6a2.6 2.6 0 1 0 0-5.2 2.6 2.6 0 0 0 0 5.2Z" />
        <path d="M14.7 13.8c2.6.3 4.8 2.4 4.8 5.2" stroke-linecap="round" />
      </svg>
      <span class="text-[13px] font-medium text-ink">Gigs</span>
    </a>
    <div class="flex flex-col items-center gap-2 rounded-2xl border border-line py-5 opacity-60">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="1.5">
        <rect x="3.5" y="3.5" width="7" height="7" rx="1.2" />
        <rect x="13.5" y="3.5" width="7" height="7" rx="1.2" />
        <rect x="3.5" y="13.5" width="7" height="7" rx="1.2" />
        <rect x="13.5" y="13.5" width="7" height="7" rx="1.2" />
      </svg>
      <span class="text-[13px] font-medium text-ink">Crew Dashboard</span>
    </div>
  </div>
</app-phone-shell>
